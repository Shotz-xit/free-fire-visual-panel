<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel de controle responsivo com validacao de key." />
    <meta property="og:title" content="Free Fire Panel" />
    <meta property="og:description" content="Painel responsivo em HTML, CSS e JavaScript." />
    <meta property="og:type" content="website" />
    <title>Free Fire Panel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="matrixCanvas" class="matrix hidden" aria-hidden="true"></canvas>

    <main class="screen">
      <section class="panel login-panel" id="loginPanel" aria-label="Login do painel">
        <div class="emblem" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path
              d="M24 5 38 11v10c0 9.8-5.7 17.9-14 22-8.3-4.1-14-12.2-14-22V11L24 5Z"
              fill="none"
              stroke="currentColor"
              stroke-width="2.8"
              stroke-linejoin="round"
            />
            <path
              d="m17 24 4.4 4.3L31 18.6"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <h1>Free Fire</h1>
        <p class="subtitle">Auxilio - painel de controle</p>

        <form class="access-box" id="accessForm">
          <label for="accessKey">Insira sua key de acesso para continuar</label>
          <div class="field">
            <span class="key-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M14.5 9.5a4 4 0 1 0-2.4 3.7L14 15h2v2h2v2h3v-3.2l-5.5-5.5c.1-.3.1-.5.1-.8Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M7.5 10.5h.01"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <input
              id="accessKey"
              name="accessKey"
              type="text"
              inputmode="text"
              autocomplete="off"
              placeholder="AUXILIO-XXXX-XXXX-XXXX"
              maxlength="23"
            />
          </div>
          <button type="submit" id="accessButton" disabled>Acessar</button>
          <p class="status" id="statusMessage" role="status" aria-live="polite"></p>
        </form>

        <p class="footer">Todos os direitos reservados - @Pedrinffx</p>
      </section>

      <section class="app-shell hidden" id="dashboard" aria-label="Painel interno">
        <nav class="side-tabs" aria-label="Abas do painel">
          <button class="tab-button active" type="button" data-tab="0" aria-label="Principal">◎</button>
          <button class="tab-button" type="button" data-tab="1" aria-label="Otimizacao">⚡</button>
          <button class="tab-button" type="button" data-tab="2" aria-label="Injetar">➤</button>
          <button class="tab-button" type="button" data-tab="3" aria-label="Info">i</button>
        </nav>

        <div class="control-card">
          <div class="tab-title" id="tabTitle">AIMBOT</div>

          <div class="tab-page active" data-page="0">
            <label class="switch-row">
              <span>Legit</span>
              <input type="checkbox" />
            </label>
            <label class="switch-row">
              <span>Retirar Input Lag</span>
              <input type="checkbox" />
            </label>
            <label class="switch-row">
              <span>Precisao</span>
              <input type="checkbox" />
            </label>
            <label class="switch-row">
              <span>Aimbot</span>
              <input type="checkbox" />
            </label>
            <div class="range-block">
              <div class="range-head">
                <span>Regular FOV</span>
                <strong><span id="fovValue">10</span>°</strong>
              </div>
              <input id="fovRange" type="range" min="1" max="20" value="10" />
            </div>
          </div>

          <div class="tab-page" data-page="1">
            <label class="switch-row">
              <span>Otimizar Jogo</span>
              <input type="checkbox" />
            </label>
            <label class="switch-row">
              <span>Ativar 144 Hz</span>
              <input type="checkbox" />
            </label>
          </div>

          <div class="tab-page" data-page="2">
            <button class="inject-button" type="button" data-target="FF NORMAL">INJETAR NO FF NORMAL</button>
            <button class="inject-button" type="button" data-target="FF MAX">INJETAR NO FF MAX</button>
            <div class="inject-status" id="injectStatus">Aguardando injecao...</div>
            <div class="terminal hidden" id="terminal">
              <div class="terminal-head">INJECTION LOG</div>
              <div class="terminal-lines" id="terminalLines"></div>
            </div>
          </div>

          <div class="tab-page" data-page="3">
            <div class="notice">Use o painel com responsabilidade.</div>
            <div class="notice">Mantenha o jogo atualizado para melhor compatibilidade.</div>
            <button class="support-button" type="button">Suporte: (21) 97448-3764</button>
            <p class="theme-label">Personalizar tema</p>
            <div class="theme-grid">
              <button class="theme-swatch red active" type="button" data-theme="red" aria-label="Vermelho"></button>
              <button class="theme-swatch green" type="button" data-theme="green" aria-label="Verde"></button>
              <button class="theme-swatch blue" type="button" data-theme="blue" aria-label="Azul"></button>
              <button class="theme-swatch purple" type="button" data-theme="purple" aria-label="Roxo"></button>
            </div>
          </div>

          <footer class="card-footer">
            <span>Todos os direitos reservados</span>
            <strong>@Pedrinffx</strong>
          </footer>
        </div>

        <button class="lock-button" id="logoutButton" type="button" aria-label="Sair">🔒</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
